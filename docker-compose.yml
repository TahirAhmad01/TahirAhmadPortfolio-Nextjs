version: "3.9"

services:
  nextjs-dev:
    build:
      context: .
      target: dev
    container_name: tahir-portfolio-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: yarn dev

  nextjs-prod:
    build:
      context: .
      target: runner
    image: tahirahmad/tahir-portfolio:v1.0
    container_name: tahir-portfolio-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    command: node server.js
